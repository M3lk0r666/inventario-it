# /etc/apache2/sites-available/inventario-it-ssl.conf
# VirtualHost HTTPS del portal Inventario TI (Laravel).
# La raíz web DEBE apuntar a la carpeta 'public' del proyecto.
#
# Activar:
#   sudo a2enmod ssl rewrite headers
#   sudo a2ensite inventario-it-ssl
#   sudo systemctl reload apache2

<VirtualHost *:443>
    ServerName inventario.local
    # ServerAlias 192.168.1.10

    DocumentRoot /var/www/inventario-it/public

    <Directory /var/www/inventario-it/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    SSLEngine on

    # --- OPCIÓN A: Certificado autofirmado local (red interna / IP) ---
    # Generado con deploy/make-selfsigned-cert.sh
    SSLCertificateFile    /etc/ssl/inventario-it/inventario-it.crt
    SSLCertificateKeyFile /etc/ssl/inventario-it/inventario-it.key

    # --- OPCIÓN B: Let's Encrypt (dominio público) ---
    # Comenta la Opción A y usa estas (tras: sudo certbot --apache -d tu-dominio):
    # SSLCertificateFile    /etc/letsencrypt/live/tu-dominio/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/tu-dominio/privkey.pem

    # Endurecimiento TLS
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder off

    # Cabeceras de seguridad
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # HSTS: actívalo solo si TODO el acceso será por HTTPS
    # Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    ErrorLog ${APACHE_LOG_DIR}/inventario-it_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/inventario-it_ssl_access.log combined
</VirtualHost>
