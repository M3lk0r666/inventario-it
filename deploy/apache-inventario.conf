# /etc/apache2/sites-available/inventario-it.conf
# VirtualHost HTTP: redirige todo a HTTPS.
# Copiar a /etc/apache2/sites-available/ y activar: sudo a2ensite inventario-it

<VirtualHost *:80>
    ServerName inventario-it.netjernetworks.net
    # ServerAlias 192.168.1.10   # descomenta si accedes por IP

    # Redirección permanente a HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/inventario-it_error.log
    CustomLog ${APACHE_LOG_DIR}/inventario-it_access.log combined
</VirtualHost>
